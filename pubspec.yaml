name: bank
description: A professional money exchange application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  
  # Icons
  font_awesome_flutter: ^10.6.0
  iconsax: ^0.0.8
  
  # Animations
  animate_do: ^3.1.2
  flutter_animate: ^4.3.0
  lottie: ^2.7.0
  
  # Charts & Graphs
  fl_chart: ^0.65.0
  syncfusion_flutter_charts: ^24.1.41
  
  # UI Enhancements
  shimmer: ^3.0.0
  flutter_slidable: ^3.0.1
  glassmorphism: ^3.0.0
  blur: ^3.1.0
  card_swiper: ^3.0.1
  
  # Utilities
  intl: ^0.19.0
  flutter_screenutil: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Uncomment and add your assets
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/lottie/